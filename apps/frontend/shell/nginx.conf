# Configuracion minima de servidor SPA.
#
# Puerto 8080, no 80: nginx corre como usuario sin privilegios (ver Dockerfile)
# y solo root puede enlazar puertos por debajo de 1024.
#
# try_files con fallback a index.html: el shell enruta con react-router en el
# cliente. Sin el fallback, recargar el navegador en una ruta profunda como
# /solicitudes/{id} pediria ese archivo al servidor, que no existe, y
# devolveria 404 en lugar de servir la SPA (el mismo defecto que <base href>
# corrigio del lado del bundler en la fase 5 — aqui es la otra mitad).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Module Federation carga remoteEntry.js y sus fragmentos cruzando origenes
    # (3000 <-> 3001). El dev server ya enviaba este mismo header (rspack.config.js);
    # sin el, la carga cruzada del remoto queda sujeta a CORS y falla en silencio.
    location = /remoteEntry.js {
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Los fragmentos con hash en el nombre (rspack los emite con contenthash)
    # pueden cachearse de forma agresiva; index.html nunca, o el navegador
    # serviria una version vieja que referencia fragmentos ya reemplazados.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
