server:
  port: ${INDICADORES_SERVICE_PORT:8082}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: indicadores-service

  datasource:
    url: jdbc:sqlserver://${SQLSERVER_HOST:localhost}:${SQLSERVER_PORT:1433};databaseName=${SQLSERVER_DB_ANALITICA:indicadores_db};encrypt=true;trustServerCertificate=true
    username: ${SQLSERVER_USER:sa}
    password: ${SQLSERVER_SA_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: auto
        # Sin esto, un mensaje que agota los reintentos vuelve a la cola y se
        # reintenta para siempre, bloqueando el consumo. Con requeue en false va
        # al dead letter exchange, que es donde debe terminar.
        default-requeue-rejected: false
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

  security:
    oauth2:
      resourceserver:
        jwt:
          # Igual que en el otro servicio: se valida el issuer que vio el
          # navegador y se descargan las claves por el nombre de red interno.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/solicitudes-gov}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/solicitudes-gov/protocol/openid-connect/certs}

indicadores:
  cors:
    origenes-permitidos: ${CORS_ORIGENES_PERMITIDOS:http://localhost:3000,http://localhost:3001}
  mensajeria:
    exchange: solicitudes.events
    exchange-dlx: solicitudes.events.dlx
    cola: indicadores.solicitudes
    cola-dlq: indicadores.solicitudes.dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    co.gov.indicadores: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-sin-correlacion}] %logger{36} - %msg%n"
