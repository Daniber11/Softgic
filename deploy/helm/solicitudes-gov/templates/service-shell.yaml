apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.shell.nombre }}
  labels:
    app.kubernetes.io/name: {{ .Values.shell.nombre }}
    {{- include "solicitudes-gov.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.shell.nombre }}
  ports:
    - name: http
      port: 80
      targetPort: http
