apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.shell.nombre }}
  labels:
    app.kubernetes.io/name: {{ .Values.shell.nombre }}
    {{- include "solicitudes-gov.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.shell.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.shell.nombre }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.shell.nombre }}
        {{- include "solicitudes-gov.labels" . | nindent 8 }}
    spec:
      # nginx ya corre como el usuario "nginx" (ver Dockerfile); no hay
      # Actuator aqui, es un SPA estatico, asi que las probes son un GET
      # simple a la raiz servida por nginx.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: {{ .Values.shell.nombre }}
          image: {{ include "solicitudes-gov.imagen" (dict "Values" .Values "imagen" .Values.shell.imagen) }}
          imagePullPolicy: {{ .Values.imagen.politicaDeDescarga }}
          ports:
            - name: http
              containerPort: {{ .Values.shell.puerto }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.shell.recursos | nindent 12 }}
